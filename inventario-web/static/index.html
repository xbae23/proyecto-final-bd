<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f7f5" />
  <meta name="description" content="Inventario Studio: sistema de inventario y ventas conectado a Oracle FreeSQL." />
  <title>Inventario Studio — Sistema de inventario y ventas</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/roles.css" />
  <link rel="stylesheet" href="/workspace.css" />
</head>
<body>
  <main class="workspace-section" id="workspace">
    <div class="app-shell">
      <aside class="sidebar" aria-label="Navegación del sistema">
        <div class="side-brand"><span class="side-icon">i.</span><span>Inventario Studio <small>ORACLE FREESQL</small></span></div>
        <div class="side-label">PRINCIPAL</div>
        <button class="nav-item active" data-view="overview"><span class="nav-icon">▦</span> Resumen <span class="nav-arrow">›</span></button>
        <button class="nav-item" data-view="products"><span class="nav-icon">□</span> Productos <span class="nav-arrow">›</span></button>
        <button class="nav-item" data-view="movements"><span class="nav-icon">⇄</span> Movimientos <span class="nav-arrow">›</span></button>
        <button class="nav-item" data-view="sales"><span class="nav-icon">◫</span> Ventas y facturas <span class="nav-arrow">›</span></button>
        <div class="side-label second">GESTIÓN</div>
        <button class="nav-item" data-view="contacts"><span class="nav-icon">♧</span> Directorio <span class="nav-arrow">›</span></button>
        <button class="nav-item" data-view="reports"><span class="nav-icon">◴</span> Reportes <span class="nav-arrow">›</span></button>
        <button class="nav-item admin-only" data-view="users"><span class="nav-icon">◎</span> Usuarios y roles <span class="nav-arrow">›</span></button>
        <div class="side-bottom"><span class="avatar">IS</span><span><strong>Inventario Studio</strong><small>Proyecto de bases de datos</small></span></div>
      </aside>
      <div class="app-main">
        <div class="app-top"><span id="breadcrumb">Inventario / Resumen</span><div><span class="connection" id="connection"><i></i> Conectando</span><span id="identity"></span><button class="icon-button" id="refresh" title="Actualizar datos" aria-label="Actualizar datos">↻</button><button class="icon-button" id="account" data-action="change-password" title="Cambiar contraseña" aria-label="Cambiar contraseña" hidden>⚙</button><button class="icon-button" id="logout" title="Cerrar sesión" aria-label="Cerrar sesión" hidden>↪</button></div></div>
        <div id="view" class="view-content"><div class="loading">Cargando datos…</div></div>
      </div>
    </div>
  </main>
  <div id="modal-root"></div><div id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
